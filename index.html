<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Deep Dive SRS</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#0f172a" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link rel="stylesheet" href="style.css" />

<div id="app">
  <header>
    <h1>Deep Dive SRS</h1>
    <div class="header-right">
      <span id="due-count"></span>
      <button id="search-open-btn" class="header-btn">Search</button>
      <button id="cram-open-btn" class="header-btn">Cram</button>
      <button id="flows-open-btn" class="header-btn">Flows</button>
      <button id="stats-open-btn" class="header-btn">Stats</button>
    </div>
  </header>

  <div id="xp-float-layer"></div>
  <div id="achievement-toast" hidden></div>

  <main id="stats-screen" hidden>
    <button id="stats-back-btn" class="header-btn">&larr; Back</button>
    <h2 id="stats-title">Stats</h2>
    <div id="stats-content"></div>
  </main>

  <main id="search-screen" hidden>
    <button id="search-back-btn" class="header-btn">&larr; Back</button>
    <h2 id="search-title">Search</h2>
    <input id="search-input" type="search" autocomplete="off" autocapitalize="off" placeholder="Search any term, e.g. in-flight request..." />
    <p id="search-count" class="search-count" hidden></p>
    <div id="search-results"></div>
    <p id="search-empty" hidden>No matches yet - try a different term.</p>
  </main>

  <main id="cram-picker-screen" hidden>
    <button id="cram-back-btn" class="header-btn" hidden>&larr; Back</button>
    <h2 id="cram-picker-title"></h2>
    <div id="cram-list"></div>
  </main>

  <main id="flows-screen" hidden>
    <button id="flows-back-btn" class="header-btn" hidden>&larr; Back</button>
    <h2 id="flows-title"></h2>
    <div id="flows-list"></div>
    <div id="flow-detail" hidden></div>
  </main>

  <main id="review-screen" hidden>
    <div id="review-card-content">
      <div class="tags">
        <span id="cram-exit-btn" class="tag tag-cram" hidden>Exit Cram</span>
        <span id="combo-indicator" class="tag tag-combo" hidden></span>
        <span id="card-subject" class="tag tag-subject"></span>
        <span id="card-difficulty" class="tag" hidden></span>
        <span id="card-block" class="tag"></span>
        <span id="card-topic" class="tag"></span>
        <span id="card-label" class="tag"></span>
      </div>
      <div id="card-tags" class="card-tags-row" hidden></div>
      <p id="card-prompt"></p>

      <button id="show-answer-btn">Show Answer</button>

      <div id="cloze-input-block" hidden>
        <input id="cloze-answer-input" type="text" autocomplete="off" autocapitalize="off" placeholder="Type the missing part..." />
        <button id="check-cloze-btn">Check</button>
        <p id="cloze-feedback" hidden></p>
      </div>

      <div id="mcq-options-block" hidden>
        <div id="mcq-options-list"></div>
      </div>

      <div id="match-block" hidden>
        <p class="match-instructions">Drag each item on the right onto its match on the left.</p>
        <div id="match-container">
          <div id="match-left-col"></div>
          <div id="match-right-col"></div>
        </div>
        <button id="match-check-btn" hidden>Check Matches</button>
      </div>

      <div id="answer" hidden>
        <pre id="card-sql"><code></code></pre>
        <p id="card-notes"></p>

        <div class="ratings">
          <button data-rating="again" class="rate rate-again">Again</button>
          <button data-rating="hard" class="rate rate-hard">Hard</button>
          <button data-rating="good" class="rate rate-good">Good</button>
          <button data-rating="easy" class="rate rate-easy">Easy</button>
        </div>
      </div>
    </div>
  </main>

  <main id="done-screen" hidden>
    <p id="done-summary"></p>
    <button id="done-cram-exit-btn" hidden>Back to Daily Review</button>
  </main>

  <main id="empty-screen" hidden>
    <p>No cards loaded.</p>
  </main>
</div>

<script src="srs.js"></script>
<script src="app.js"></script>
